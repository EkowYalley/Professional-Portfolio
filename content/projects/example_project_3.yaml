title: "AWS NYC 311 Service Resolution Modeling"
context: "Predictive modeling · 6 validation checks passed"

short_summary: >
  Built a leakage-safe logistic-regression baseline using 49,999 validated public NYC 311 records and a target derived from actual creation and closure timestamps.

tech_stack:
  - Python
  - pandas
  - scikit-learn
  - AWS S3
  - Athena
  - SageMaker

problem_statement: >
  Explore whether basic request attributes can help distinguish NYC 311 complaints resolved within three days from those that take longer.

approach: >
  Recreated a deterministic public-data sample, derived resolution duration from timestamps, excluded post-resolution fields from the feature matrix, and used a stratified train/test split with a preprocessing-and-model pipeline.

results_impact: >
  The test set produced 78.7% accuracy, 88.6% precision, 73.7% recall, an 80.5% F1 score, and 88.3% ROC AUC, outperforming the 59.5% majority-class accuracy benchmark.
validation: >
  Six automated checks passed, covering timestamp-based target derivation, leakage prevention, train/test ID separation, nonnegative durations, class presence, and probability bounds.
limitations: >
  The sample covers Jan 29–Mar 21, 2026 and only includes closed requests. Results are historical associations and require subgroup and time-period monitoring before any operational use.


