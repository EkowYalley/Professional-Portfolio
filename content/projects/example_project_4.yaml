title: "Regional Sales Reporting Pipeline"
context: "Data pipeline · 8 checks and 4 tests passed"

short_summary: >
  Built a reproducible Python pipeline that validates sales and customer files, joins them, creates regional and category reporting, and reconciles $7,816.00 from source to output.

tech_stack:
  - Python
  - pandas
  - Matplotlib
  - unittest

problem_statement: >
  Turn raw transaction and customer lookup files into a reporting-ready regional summary without silently accepting duplicate orders, invalid fields, unmatched customers, or reconciliation gaps.

approach: >
  Added schema and data-quality validation, calculated line revenue, joined customer attributes, aggregated unique orders and revenue, produced a chart, and wrote machine-readable source-to-output checks.

results_impact: >
  The included run reconciles all 48 orders and $7,816.00 of source revenue to 12 reporting rows. Eight pipeline checks and four unit tests pass.

validation: >
  Checks cover required columns, unique orders, parsed dates, positive units, nonnegative prices, customer matches, revenue reconciliation, and order-count reconciliation. Unit tests confirm that duplicate orders and unmatched customers are detected.

limitations: >
  The 48-row dataset is a small supplied sample. It demonstrates workflow design and validation rather than production scale, and it does not include returns, discounts, taxes, incremental loading, or orchestration.

