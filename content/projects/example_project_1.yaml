title: "Rental Revenue Analysis in SQL"
context: "SQL analysis · 5 validation checks passed"

short_summary: >
  Analyzed $67,406.56 of linked rental revenue across 200 actors in the fictional Sakila database using joins, grouped aggregation, CTEs, and window functions.


tech_stack:
  - Python
  - SQL
  - pandas
  - SQLAlchemy
  - Docker
  - Jupyter

problem_statement: >
  Identify which actors are associated with the highest rental revenue and which film categories contribute most to each actor's total.

approach: >
  Calculated film-level revenue from payment, rental, and inventory records; joined films to actors and categories; then used grouped aggregation and window functions to rank actors and calculate category shares.


results_impact: >
  Reconciled $67,406.56 of linked film revenue to the $67,416.51 payment total after identifying five unmatched payments totaling $9.95. Produced manager-ready top-20 and actor-category outputs.
validation: >
  Five automated checks passed: revenue reconciliation, rental-to-inventory integrity, category-share totals, unique top-20 actors, and descending revenue order.
limitations: >
  Sakila is fictional sample data. Revenue is associated with films in which an actor appears; it does not estimate that actor's causal contribution, and actor totals cannot be added because films have multiple actors.

